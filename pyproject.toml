[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "work121"
version = "0.2.0"
description = "Defensive LLM interoperability, indirect-input protocol analysis, live MCP tool-calling, OWASP auditing, and cross-version safety regression tracking."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "jsonschema>=4.20.0",
    "pillow>=10.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "agent-comm-robustness @ git+https://github.com/Grantgazvoda-alt/work122.git@c9c32e2892b598672136742080f23d38394e3f14",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "websockets>=12.0",
]

[project.scripts]
work121 = "cli:main"
work121-live = "run_live_eval:main"
work121-mcp = "mcp_http_server:main"
work121-wheel = "hamster_wheel:main"
work121-server = "backend_server:main"

[tool.setuptools]
packages = ["agent_comm_robustness"]
py-modules = [
    "backend_server",
    "boundary_oracle",
    "cli",
    "dashboard",
    "eval_runner",
    "hamster_wheel",
    "indirect_input_classifier",
    "live_adapters",
    "live_providers",
    "mcp_http_server",
    "multi_agent_relay",
    "oracle_keys",
    "owasp_defensive_auditor",
    "regression_tracker",
    "report_generator",
    "response_classifier",
    "run_live_eval",
    "semantic_judge",
    "statistical_analysis",
    "template_library",
    "tool_runtime",
    "wire_suite",
    "wire_transport",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-o tmp_path_retention_policy=none --basetemp=.pytest_tmp"

