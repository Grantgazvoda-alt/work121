[project]
name = "work121"
version = "0.1.0"
description = "Defensive LLM response-pattern classification, benign validation templates, OWASP auditing, and cross-version safety regression tracking."
requires-python = ">=3.10"

[project.optional-dependencies]
ui = ["streamlit>=1.38.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
work121 = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
